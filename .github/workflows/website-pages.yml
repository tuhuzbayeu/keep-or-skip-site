name: Publish official website

# Explicit dispatch only: nothing runs on push/PR. Do not dispatch before the
# controller has resolved and approved the publication record below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-website-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tuhuzbayeu/keep-or-skip-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate static files and publication approval
        run: |
          python3 Scripts/check-website.py --publication --review-file publication.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the validated static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
